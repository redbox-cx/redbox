name: redbox-frontend

services:
  frontend:
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE}/redbox-frontend:${REDBOX_IMAGE_TAG:?set REDBOX_IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - redbox_frontend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on:
      - frontend
    networks:
      - redbox_frontend

networks:
  redbox_frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
