services:
  # MariaDB: main db for users / files
  mariadb:
    image: mariadb:latest
    container_name: redbox-mariadb
    restart: always
    environment:
      # must be the same as .env in /apps/backend/.env
      MYSQL_ROOT_PASSWORD: testpass123
      MYSQL_DATABASE: redbox_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  # Redis: not needed rn, later for securesphere
  redis:
    image: redis:alpine
    container_name: redbox-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mariadb_data:
